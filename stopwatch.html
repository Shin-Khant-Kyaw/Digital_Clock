<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">


    <title>Digital Clock</title>
</head>
<body class="bg-black">
    <nav class="navbar navbar-expand-lg navbar-light bg-dark">
            <a class="navbar-brand text-white px-lg-5 px-2 fw-bold" href="#">Clock</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation " data-bs-theme="dark">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
                <ul class="navbar-nav d-flex align-items-center justify-content-around gap-lg-4 gap-2">
                <li class="nav-item active">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="stopwatch.html">Stop Watch</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="worldclock.html">World clock</a>
                </li>
                
                </ul>
            </div>
    </nav>
    <div class=" container my-lg-5 my-2  w-100 ">
        <div class="clock d-flex align-items-center justify-content-center flex-column gap-5">
            <h4 id="display" class="text-primary display-1 fw-medium ">
                00:00:00.<span id="ms" class="display-5 fw-medium">00</span>
            </h4>
            <div class="btn-container d-flex gap-2 gap-lg-5">
                <button type="button" id="startBtn" class="border-0 px-lg-5 py-3 px-4 rounded-pill play" ><i class="fa-solid fa-play"></i></button>
                <button type="button" id="reset" class="border-0 px-lg-5 py-3 px-4 rounded-pill reset" ><i class="fa-solid fa-flag"></i></button>
                <button type="button" id="pauseStart" class="border-0 px-lg-5 py-3 px-4 rounded-pill pause " ><i class="fa-solid fa-pause"></i></button>

            </div>
        </div>
        <div class="timeMarking-container d-grid text-center p-3 p-lg-5" id="timeMarkingContainer">
          
            
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="stopwatch.js"></script>
</body>
</html>
